name: Messdaten verarbeiten

# Laeuft, sobald das Aussengeraet ein neues Rohpaket hochgeladen hat.
# Die Action fuegt die Pakete zu Tagesdateien zusammen, raeumt die Rohdaten
# weg und baut daraus die Datei fuer das Dashboard.
on:
  push:
    paths:
      - 'roh/**'
  workflow_dispatch:        # von Hand ausloesbar

# Zwei gleichzeitige Laeufe wuerden sich beim Schreiben in die Quere kommen.
concurrency:
  group: messdaten
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verarbeiten:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rohpakete einarbeiten
        run: python werkzeuge/verarbeiten.py

      - name: Ergebnis einchecken
        run: |
          git config user.name  "Kellerlueftung Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A tage daten.json roh
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "Messdaten verarbeitet"
            git push
          fi

  veroeffentlichen:
    needs: verarbeiten
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Aktuellen Stand holen
        run: git pull --ff-only || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: pages
        uses: actions/deploy-pages@v4
